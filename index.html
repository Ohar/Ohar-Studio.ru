<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070916">
  <title>Ohar Studio</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #070916; color: #f5f7ff; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    main { width: min(680px, calc(100vw - 32px)); padding: 40px 0; }
    h1 { margin: 0 0 12px; font-size: clamp(34px, 8vw, 72px); line-height: 0.95; letter-spacing: 0; }
    p { max-width: 520px; margin: 0 0 28px; color: #9aa6cf; font-size: 18px; line-height: 1.55; }
    a { display: inline-flex; align-items: center; min-height: 46px; padding: 0 18px; border: 1px solid rgba(53, 242, 255, 0.45); border-radius: 8px; color: #35f2ff; text-decoration: none; font-weight: 700; }
    small { display: block; margin-top: 48px; color: #596486; }
  </style>
</head>
<body>
  <main>
    <h1>Ohar Studio</h1>
    <p>Игры и интерактивные проекты. Сайт скоро откроется, а Neon Shift уже готовится к запуску в Telegram.</p>
    <a href="https://t.me/neon_shift_bot">Neon Shift</a>
    <small>ohar-studio.ru</small>
  </main>
</body>
</html>
