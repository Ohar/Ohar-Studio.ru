name: Deploy production

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Normalize deployment settings
        shell: bash
        run: |
          {
            printf 'DEPLOY_HOST=%s\n' "$(printf '%s' "$DEPLOY_HOST" | tr -d '\r\n')"
            printf 'DEPLOY_USER=%s\n' "$(printf '%s' "$DEPLOY_USER" | tr -d '\r\n')"
          } >> "$GITHUB_ENV"

      - name: Validate deployment settings
        shell: bash
        run: |
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - name: Install Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Build static site
        run: yarn build

      - name: Verify generated pages
        run: yarn test:i18n

      - name: Verify CV PDF page count
        run: yarn test:cv-pdf

      - name: Verify committed export
        run: yarn test:published

      - name: Smoke test build
        shell: bash
        run: |
          test -s assets/site/index.html
          test -s assets/site/404.html
          test -s assets/neon-shift-hero.png
          grep -Eq '<title[^>]*>Ohar</title>' assets/site/index.html
          grep -Fq 'https://rosterama.ru/' assets/site/portfolio/index.html
          grep -Fq 'https://yandex.ru/games/app/neon-shift-544710' assets/site/portfolio/index.html
          grep -Fq 'try_files $uri $uri/ =404;' infra/nginx/ohar-studio.ru.conf
          grep -Fq 'root /var/www/ohar-studio.ru/current/assets/site;' infra/nginx/ohar-studio.ru.conf

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy repository commit
        shell: bash
        run: ssh "$DEPLOY_USER@$DEPLOY_HOST" "sudo /usr/local/sbin/deploy-ohar-studio '$GITHUB_SHA'"
