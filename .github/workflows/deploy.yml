name: Deploy production

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Normalize deployment settings
        shell: bash
        run: |
          {
            printf 'DEPLOY_HOST=%s\n' "$(printf '%s' "$DEPLOY_HOST" | tr -d '\r\n')"
            printf 'DEPLOY_USER=%s\n' "$(printf '%s' "$DEPLOY_USER" | tr -d '\r\n')"
          } >> "$GITHUB_ENV"

      - name: Validate deployment settings
        shell: bash
        run: |
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - name: Install Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Build static site
        run: yarn build

      - name: Verify generated pages
        run: yarn test:i18n

      - name: Verify CV PDF generation
        run: yarn test:cv-pdf

      - name: Verify deployment archive validation
        run: python3 -m unittest discover -s tests -p 'test_deploy_archive.py'

      - name: Smoke test build
        shell: bash
        run: |
          test -s out/index.html
          test -s out/404.html
          test -s out/assets/neon-shift-hero.png
          grep -Eq '<title[^>]*>Ohar</title>' out/index.html
          grep -Fq 'https://rosterama.ru/' out/portfolio/index.html
          grep -Fq 'https://yandex.ru/games/app/neon-shift-544710' out/portfolio/index.html
          grep -Fq 'try_files $uri $uri/ =404;' infra/nginx/ohar-studio.ru.conf
          grep -Fq 'root /var/www/ohar-studio.ru/current;' infra/nginx/ohar-studio.ru.conf
          test -z "$(git ls-files -- out .next assets/site index.html .static-publish.json)"

      - name: Package tested build
        run: |
          printf '%s\n' "$GITHUB_SHA" > out/.deploy-commit
          tar -C out -czf site.tar.gz .
          python3 infra/deploy/extract-release.py site.tar.gz "$RUNNER_TEMP/ohar-studio-export" "$GITHUB_SHA"
          printf 'ARCHIVE_SHA256=%s\n' "$(sha256sum site.tar.gz | cut -d ' ' -f 1)" >> "$GITHUB_ENV"

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload tested build
        shell: bash
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p /home/deploy/ohar-studio-upload/$GITHUB_SHA"
          scp site.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/home/deploy/ohar-studio-upload/$GITHUB_SHA/site.tar.gz"

      - name: Activate release
        shell: bash
        run: ssh "$DEPLOY_USER@$DEPLOY_HOST" "sudo /usr/local/sbin/deploy-ohar-studio '$GITHUB_SHA' '$ARCHIVE_SHA256'"

      - name: Verify production
        shell: bash
        run: |
          test "$(curl --fail --silent --show-error --retry 3 https://ohar-studio.ru/.deploy-commit)" = "$GITHUB_SHA"
          curl --fail --silent --show-error --retry 3 https://ohar-studio.ru/portfolio/ > /dev/null
