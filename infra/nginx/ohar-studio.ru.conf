server {
    listen 80;
    listen [::]:80;
    server_name ohar-studio.ru www.ohar-studio.ru;

    return 301 https://ohar-studio.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name www.ohar-studio.ru;

    ssl_certificate /etc/letsencrypt/live/ohar-studio.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ohar-studio.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://ohar-studio.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name ohar-studio.ru;
    root /var/www/ohar-studio.ru/current/assets/site;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/ohar-studio.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ohar-studio.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location ^~ /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Keep image URLs from the former standalone showcase available.
    location /assets/ {
        root /var/www/ohar-studio.ru/current;
        try_files $uri =404;
    }
}
